name = "ai-product-video-studio"
main = "worker/index.ts"
compatibility_date = "2026-11-15"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "ai-product-video-studio-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
SESSION_DAYS = "7"
